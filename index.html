<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MingOS</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <style>
        :root {
            --bg-base: #1E3A5F;
            --panel-bg: rgba(30, 30, 30, 0.85);
            --window-bg: #2b2a29;
            --text-colour: #fdfdfd;
            --accent-colour: #f6a15a;
            --title-bar: #383635;
            --dock-bg: rgba(40, 40, 40, 0.7);
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Fira Sans', system-ui, sans-serif;
            overflow: hidden; background-color: var(--bg-base);
            color: var(--text-colour); user-select: none;
        }

        #bg-fluid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; filter: blur(120px); transform: scale(1.2); opacity: 0.85;
            pointer-events: none;
        }
        
        #bg-particles {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        #splash-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 99999; display: flex; align-items: center; justify-content: center;
            perspective: 1000px;
        }

        .pulse-container {
            animation: aggressive-pulse 4s infinite ease-in-out;
            will-change: transform;
        }

        @keyframes aggressive-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        #splash-box {
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid var(--accent-colour);
            border-radius: 16px; padding: 3.5rem 5rem; text-align: center;
            backdrop-filter: blur(15px); pointer-events: auto;
            box-shadow: 0 0 30px rgba(246, 161, 90, 0.2);
            transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 2s ease-out;
            backface-visibility: hidden;
        }
        
        .booting #splash-box {
            transform: scale(4);
            opacity: 0;
            pointer-events: none;
        }

        .splash-logo { 
            max-width: 500px; 
            width: 100%;
            height: auto; 
            margin-bottom: 0.5rem; 
            display: block;
            margin-left: auto;
            margin-right: auto;
            filter: drop-shadow(0 0 15px rgba(246, 161, 90, 0.5)); 
        }
        
        .boot-btn {
            background-color: var(--accent-colour); color: #111; border: none;
            padding: 1rem 2.5rem; font-size: 1.3rem; font-weight: 800;
            border-radius: 6px; cursor: pointer; transition: background 0.2s;
            text-transform: uppercase;
        }
        .boot-btn:hover { background-color: #fff; }

        #desktop-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; opacity: 0; transition: opacity 3s ease 1s; pointer-events: none;
        }
        
        #desktop-ui.active { opacity: 1; pointer-events: auto; }

        .top-bar { position: absolute; top: 0; width: 100%; height: 30px; background-color: var(--panel-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 1.2rem; box-sizing: border-box; font-size: 0.85rem; font-weight: 600; backdrop-filter: blur(10px); }
        .top-bar-centre { position: absolute; left: 50%; transform: translateX(-50%); }
        
        .dock { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: var(--dock-bg); padding: 0.6rem; border-radius: 20px; display: flex; gap: 1rem; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); }
        .dock-icon { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s; position: relative; }
        .dock-icon:hover { background-color: rgba(255, 255, 255, 0.15); transform: translateY(-10px) scale(1.15); }
        .dock-icon.active::after { content: ''; position: absolute; bottom: -8px; width: 5px; height: 5px; background-color: var(--accent-colour); border-radius: 50%; box-shadow: 0 0 8px var(--accent-colour); }

        .window { position: absolute; width: 620px; background-color: var(--window-bg); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); display: none; flex-direction: column; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); }
        .window.active { display: flex; }
        .window.active-focus { border-color: var(--accent-colour); }
        .title-bar { background-color: var(--title-bar); padding: 0.7rem 1.2rem; display: flex; justify-content: space-between; align-items: center; cursor: move; }
        .close-btn { background: #ff5f57; border: none; width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .window-content { padding: 1.8rem; min-height: 320px; overflow-y: auto; background: #2b2a29; }
        .project-card { background: rgba(58, 56, 55, 0.5); padding: 1.4rem; margin-bottom: 1.2rem; border-radius: 8px; border-left: 4px solid var(--accent-colour); }
    </style>
</head>
<body>

    <canvas id="bg-fluid"></canvas>
    <canvas id="bg-particles"></canvas>

    <div id="splash-wrapper">
        <div class="pulse-container" id="pulse-box">
            <div id="splash-box">
                <img src="logo.png" alt="MingOS Logo" class="splash-logo">
                <button class="boot-btn" onclick="bootSystem()">Initialise</button>
            </div>
        </div>
    </div>

    <div id="desktop-ui">
        <div class="top-bar">
            <div>Activities</div>
            <div class="top-bar-centre" id="clock">00:00</div>
            <div>⚙️ 🔋 📶</div>
        </div>

        <div class="dock">
            <div class="dock-icon" id="dock-robotics" onclick="toggleWindow('robotics-win', this)" onmouseenter="playRandomPop()" title="Robotics">⚙️</div>
            <div class="dock-icon" id="dock-software" onclick="toggleWindow('software-win', this)" onmouseenter="playRandomPop()" title="Software">💻</div>
            <div class="dock-icon" id="dock-readme" onclick="toggleWindow('readme-win', this)" onmouseenter="playRandomPop()" title="System Info">📄</div>
        </div>

        <div id="robotics-win" class="window" style="top: 15%; left: 15%;">
            <div class="title-bar"><span class="window-title">Robotics</span><button onclick="toggleWindow('robotics-win', document.getElementById('dock-robotics'))" class="close-btn"></button></div>
            <div class="window-content"><div class="project-card"><h4>Autonomous Rover Mk II</h4><p>RPLIDAR integration.</p></div></div>
        </div>

        <div id="software-win" class="window" style="top: 20%; left: 20%;">
            <div class="title-bar"><span class="window-title">Software</span><button onclick="toggleWindow('software-win', document.getElementById('dock-software'))" class="close-btn"></button></div>
            <div class="window-content"><div class="project-card"><h4>Telemetry Dashboard</h4><p>WebSockets and Python.</p></div></div>
        </div>

        <div id="readme-win" class="window" style="top: 10%; left: 50%;">
            <div class="title-bar"><span class="window-title">System_Info.log</span><button onclick="toggleWindow('readme-win', document.getElementById('dock-readme'))" class="close-btn"></button></div>
            <div class="window-content" style="background: #181818; font-family: monospace;"><p style="color: #00ff00;">> System Online.</p></div>
        </div>
    </div>

    <script src="os-background.js"></script>

    <script>
        function bootSystem() {
            const loginAudio = new Audio('login.mp3');
            loginAudio.play().catch(e => {});

            const pulseContainer = document.getElementById('pulse-box');
            pulseContainer.style.animation = 'none';

            document.getElementById('splash-wrapper').classList.add('booting');
            document.getElementById('desktop-ui').classList.add('active');
            
            setTimeout(() => {
                document.getElementById('splash-wrapper').style.display = 'none';
            }, 4000);
        }

        function playRandomPop() {
            const pops = ['pop1.mp3', 'pop2.mp3', 'pop3.mp3'];
            const randomPop = pops[Math.floor(Math.random() * pops.length)];
            const audio = new Audio(randomPop);
            audio.volume = 0.3;
            audio.play().catch(e => {});
        }

        let zIndexCounter = 100;
        function toggleWindow(winId, dockElement) {
            const win = document.getElementById(winId);
            if (win.classList.contains('active')) {
                win.classList.remove('active');
                dockElement.classList.remove('active');
            } else {
                win.classList.add('active');
                dockElement.classList.add('active');
                focusWindow(win);
            }
        }

        function focusWindow(win) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('active-focus'));
            win.classList.add('active-focus');
            zIndexCounter++;
            win.style.zIndex = zIndexCounter;
        }

        document.querySelectorAll('.window').forEach(win => {
            win.addEventListener('mousedown', () => focusWindow(win));
            const titleBar = win.querySelector('.title-bar');
            let isDragging = false, offsetX, offsetY;
            titleBar.addEventListener('mousedown', (e) => {
                isDragging = true;
                offsetX = e.clientX - win.getBoundingClientRect().left;
                offsetY = e.clientY - win.getBoundingClientRect().top;
                focusWindow(win);
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                win.style.left = (e.clientX - offsetX) + 'px';
                win.style.top = (e.clientY - offsetY) + 'px';
            });
            document.addEventListener('mouseup', () => { isDragging = false; });
        });

        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('clock').textContent = now.toLocaleDateString('en-GB', options).replace(',', '');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
