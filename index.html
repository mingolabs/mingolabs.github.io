<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MingoLabs OS</title>
    <style>
        :root {
            --desktop-bg: #0f4c81;
            --window-bg: #1e1e1e;
            --text-colour: #f0f0f0;
            --accent-colour: #00d2ff;
            --title-bar: #333;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background-color: var(--desktop-bg);
            color: var(--text-colour);
            user-select: none;
        }
        
        /* Desktop Icons */
        .desktop {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: flex-start;
        }
        .icon {
            width: 80px;
            text-align: center;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
        }
        .icon:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .icon-img {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .icon-text {
            font-size: 0.85rem;
            text-shadow: 1px 1px 2px #000;
        }

        /* Window System */
        .window {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 500px;
            background-color: var(--window-bg);
            border: 1px solid var(--title-bar);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            z-index: 10;
        }
        .window.active {
            display: flex;
        }
        .title-bar {
            background-color: var(--title-bar);
            padding: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            border-bottom: 2px solid var(--accent-colour);
        }
        .close-btn {
            background: #ff5f56;
            border: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            cursor: pointer;
        }
        .window-content {
            padding: 1.5rem;
            min-height: 200px;
        }

        /* Taskbar */
        .taskbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            border-top: 1px solid #333;
            z-index: 20;
        }
        .start-btn {
            font-weight: bold;
            color: var(--accent-colour);
            cursor: pointer;
        }

        /* Project Cards inside Window */
        .project {
            background: #2a2a2a;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 3px solid var(--accent-colour);
        }
        .project h4 { margin: 0 0 0.5rem 0; }
        .project p { margin: 0; font-size: 0.9rem; color: #ccc; }
    </style>
</head>
<body>

    <div class="desktop">
        <div class="icon" onclick="openWindow('Robotics', roboticsData)">
            <span class="icon-img">⚙️</span>
            <span class="icon-text">Robotics.dir</span>
        </div>
        <div class="icon" onclick="openWindow('Software', softwareData)">
            <span class="icon-img">💻</span>
            <span class="icon-text">Software.dir</span>
        </div>
        <div class="icon" onclick="openWindow('ReadMe', readmeData)">
            <span class="icon-img">📄</span>
            <span class="icon-text">ReadMe.txt</span>
        </div>
    </div>

    <div id="app-window" class="window">
        <div class="title-bar" id="title-bar">
            <span id="window-title">Folder</span>
            <button class="close-btn" onclick="closeWindow()"></button>
        </div>
        <div class="window-content" id="window-content"></div>
    </div>

    <div class="taskbar">
        <span class="start-btn">MingoLabs OS</span>
    </div>

    <script>
        // Data Payloads
        const roboticsData = `
            <div class="project">
                <h4>Autonomous Rover</h4>
                <p>Custom chassis with ultrasonic sensors and LIDAR for 2D room mapping. C++ / Arduino.</p>
            </div>
            <div class="project">
                <h4>Greenhouse Controller</h4>
                <p>ESP32 system monitoring soil moisture and operating relays. Electronics / C++.</p>
            </div>`;
            
        const softwareData = `
            <div class="project">
                <h4>Telemetry Visualisation</h4>
                <p>Web dashboard built to graph incoming hardware data in real-time. Python / JS.</p>
            </div>`;
            
        const readmeData = `
            <h3>Welcome to MingoLabs</h3>
            <p>This is my engineering portfolio showcasing builds in software, robotics, and electronics.</p>
            <p>Select a directory on the desktop to view projects.</p>`;

        // Window Logic
        const appWindow = document.getElementById('app-window');
        const windowTitle = document.getElementById('window-title');
        const windowContent = document.getElementById('window-content');

        function openWindow(title, content) {
            windowTitle.textContent = title;
            windowContent.innerHTML = content;
            appWindow.classList.add('active');
        }

        function closeWindow() {
            appWindow.classList.remove('active');
        }

        // Drag Logic
        const titleBar = document.getElementById('title-bar');
        let isDragging = false;
        let offsetX, offsetY;

        titleBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - appWindow.getBoundingClientRect().left;
            offsetY = e.clientY - appWindow.getBoundingClientRect().top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            appWindow.style.left = (e.clientX - offsetX) + 'px';
            appWindow.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
