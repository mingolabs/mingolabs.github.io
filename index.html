<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MingOS</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-base: #1E3A5F;
            --panel-bg: rgba(30, 30, 30, 0.85);
            --window-bg: #2b2a29;
            --text-colour: #fdfdfd;
            --accent-colour: #f6a15a;
            --title-bar: #383635;
            --dock-bg: rgba(40, 40, 40, 0.7);
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Fira Sans', system-ui, sans-serif;
            overflow: hidden; background-color: var(--bg-base);
            color: var(--text-colour); user-select: none;
        }

        /* Custom OS Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
            transition: background 0.2s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-colour);
        }

        #bg-fluid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; filter: blur(120px); transform: scale(1.2); opacity: 0.85;
            pointer-events: none;
        }
        
        #bg-particles {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        #splash-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 99999; display: flex; align-items: center; justify-content: center;
            perspective: 1000px;
        }

        .pulse-container {
            animation: aggressive-pulse 4s infinite ease-in-out;
            will-change: transform;
        }

        @keyframes aggressive-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        #splash-box {
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid var(--accent-colour);
            border-radius: 16px; 
            padding: 3rem 4rem; 
            text-align: center;
            backdrop-filter: blur(15px); pointer-events: auto;
            box-shadow: 0 0 30px rgba(246, 161, 90, 0.2);
            transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 2s ease-out;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .booting #splash-box {
            transform: scale(4);
            opacity: 0;
            pointer-events: none;
        }

        .splash-logo { 
            width: 300px; 
            max-width: 80vw; 
            height: auto; 
            margin: 0; 
            display: block;
            filter: drop-shadow(0 0 15px rgba(246, 161, 90, 0.5)); 
        }
        
        .boot-btn {
            background-color: var(--accent-colour); color: #111; border: none;
            padding: 1rem 2.5rem; font-size: 1.3rem; font-weight: 800;
            border-radius: 6px; cursor: pointer; transition: background 0.2s;
            text-transform: uppercase; margin-top: 1rem;
        }
        .boot-btn:hover { background-color: #fff; }

        #desktop-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; opacity: 0; transition: opacity 3s ease 1s; pointer-events: none;
        }
        
        #desktop-ui.active { opacity: 1; pointer-events: auto; }

        .top-bar { position: absolute; top: 0; width: 100%; height: 30px; background-color: var(--panel-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 1.2rem; box-sizing: border-box; font-size: 0.85rem; font-weight: 600; backdrop-filter: blur(10px); }
        .top-bar-centre { position: absolute; left: 50%; transform: translateX(-50%); }
        
        .dock { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: var(--dock-bg); padding: 0.6rem; border-radius: 20px; display: flex; gap: 1rem; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); }
        .dock-icon { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s; position: relative; }
        .dock-icon:hover { background-color: rgba(255, 255, 255, 0.15); transform: translateY(-10px) scale(1.15); }
        .dock-icon.active::after { content: ''; position: absolute; bottom: -8px; width: 5px; height: 5px; background-color: var(--accent-colour); border-radius: 50%; box-shadow: 0 0 8px var(--accent-colour); }

        /* Window Base Styles */
        .window { 
            position: absolute; width: 620px; background-color: var(--window-bg); 
            border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); 
            display: none; flex-direction: column; overflow: hidden; 
            border: 2px solid rgba(255, 255, 255, 0.1); 
            transition: width 0.3s, height 0.3s, top 0.3s, left 0.3s, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s; 
            transform-origin: center bottom;
            min-width: 340px; min-height: 250px;
        }
        .window.active { display: flex; }
        .window.active-focus { border-color: var(--accent-colour); }
        
        /* Dragging & Resizing States: Kills transitions so movement is 1:1 with the mouse */
        .window.dragging, .window.resizing {
            transition: none !important;
        }
        
        /* Invisible Resizer Handles */
        .resizer { position: absolute; z-index: 100; }
        .resizer-r { right: 0; top: 0; width: 8px; height: 100%; cursor: e-resize; }
        .resizer-b { bottom: 0; left: 0; width: 100%; height: 8px; cursor: s-resize; }
        .resizer-br { right: 0; bottom: 0; width: 16px; height: 16px; cursor: se-resize; z-index: 101; }
        
        /* Minimised & Maximised States */
        .window.minimised { transform: scale(0.4) translateY(300px); opacity: 0; pointer-events: none; }
        .window.maximised { top: 30px !important; left: 0 !important; width: 100vw !important; height: calc(100vh - 30px) !important; border-radius: 0; border: none; }
        
        /* Window Controls */
        .title-bar { background-color: var(--title-bar); padding: 0.7rem 1.2rem; display: flex; justify-content: space-between; align-items: center; cursor: default; }
        .window-controls { display: flex; gap: 8px; align-items: center; }
        .win-btn { width: 13px; height: 13px; border-radius: 50%; border: none; cursor: pointer; }
        .min-btn { background: #ffbd2e; border-radius: 0; clip-path: inset(40% 10% 40% 10% round 2px); }
        .max-btn { background: #34c759; border-radius: 3px; }
        .close-btn { background: #ff5f57; }
        
        /* Markdown Content Styling */
        .window-content { padding: 1.8rem; min-height: 320px; overflow-y: auto; background: #2b2a29; user-select: text; flex-grow: 1; }
        .window-content h1, .window-content h2, .window-content h3 { color: var(--accent-colour); margin-top: 0; }
        .window-content a { color: #00d2ff; text-decoration: none; }
        .window-content a:hover { text-decoration: underline; }
        .window-content code { background: #111; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .window-content pre { background: #111; padding: 1rem; border-radius: 6px; overflow-x: auto; }
        .window-content pre code { padding: 0; background: transparent; }
        .window-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 1rem 0; }
        .loading-text { color: #888; font-style: italic; }
        .error-text { color: #ff5f57; font-weight: bold; }

        /* MingoMail Specific Styling */
        .mail-content { padding: 0; display: flex; flex-direction: column; height: 500px; }
        .mail-header { padding: 1rem 1.5rem; background: #222; border-bottom: 1px solid #333; display: grid; grid-template-columns: 80px 1fr; gap: 0.8rem; align-items: center; }
        .mail-header label { color: #aaa; font-size: 0.9rem; text-align: right; padding-right: 0.5rem; }
        .mail-header input { background: transparent; border: none; color: #fff; font-size: 1rem; font-family: inherit; outline: none; border-bottom: 1px solid transparent; padding: 0.2rem 0; transition: border-color 0.2s; }
        .mail-header input:focus { border-bottom: 1px solid var(--accent-colour); }
        .mail-header input[readonly] { color: #777; cursor: not-allowed; }
        
        .editor-toolbar { padding: 0.6rem 1.5rem; background: #2a2a2a; border-bottom: 1px solid #444; display: flex; gap: 0.5rem; }
        .editor-toolbar button { background: #383838; border: 1px solid #555; color: #fff; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; font-family: 'Fira Sans', sans-serif; transition: background 0.2s; }
        .editor-toolbar button:hover { background: var(--accent-colour); color: #000; border-color: var(--accent-colour); }
        
        .editor-body { flex-grow: 1; padding: 1.5rem; outline: none; color: #eee; line-height: 1.6; overflow-y: auto; background: #1e1e1e; cursor: text; user-select: text; }
        .editor-body:empty:before { content: 'Compose your message here...'; color: #666; pointer-events: none; display: block; }
        
        .mail-footer { padding: 1rem 1.5rem; background: #222; border-top: 1px solid #333; display: flex; justify-content: flex-end; }
        .send-btn { background: var(--accent-colour); color: #000; border: none; padding: 0.6rem 2rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .send-btn:hover:not(:disabled) { background: #fff; }
        .send-btn:disabled { opacity: 0.7; cursor: wait; }
    </style>
</head>

    <div id="mimi-eyes-wrapper">
        <div id="mimi-eyes">
            <svg class="mimi-eye" viewBox="0 0 24 24"><path d="M12 3L2 21h20L12 3z"/></svg>

<script>
    const mimiContainer = document.getElementById('mimi-container');
    const mimiEyes = document.getElementById('mimi-eyes');

    // Eye Tracking Logic
    document.addEventListener('mousemove', (e) => {
        if (!mimiEyes || !mimiContainer) return;
        
        const rect = mimiContainer.getBoundingClientRect();
        const mimiCentreX = rect.left + rect.width / 2;
        const mimiCentreY = rect.top + rect.height / 2;
        
        const deltaX = e.clientX - mimiCentreX;
        const deltaY = e.clientY - mimiCentreY;
        
        const angle = Math.atan2(deltaY, deltaX);
        const maxEyeMove = 8; 
        const distance = Math.min(Math.hypot(deltaX, deltaY) / 45, maxEyeMove); 
        
        const moveX = Math.cos(angle) * distance;
        const moveY = Math.sin(angle) * distance;
        
        mimiEyes.style.transform = `translate(${moveX}px, ${moveY}px)`;
    });

    // Dragging Logic
    window.isDraggingMimi = false;
    let mimiOffsetX, mimiOffsetY;

    mimiContainer.addEventListener('mousedown', (e) => {
        window.isDraggingMimi = true;
        mimiContainer.classList.add('dragging');
        
        // Convert from bottom/right to left/top to lock 1:1 with the mouse
        const rect = mimiContainer.getBoundingClientRect();
        mimiContainer.style.left = rect.left + 'px';
        mimiContainer.style.top = rect.top + 'px';
        mimiContainer.style.bottom = 'auto';
        mimiContainer.style.right = 'auto';
        
        mimiOffsetX = e.clientX - rect.left;
        mimiOffsetY = e.clientY - rect.top;
        e.preventDefault(); 
    });

    document.addEventListener('mousemove', (e) => {
        if (!window.isDraggingMimi) return;
        mimiContainer.style.left = (e.clientX - mimiOffsetX) + 'px';
        mimiContainer.style.top = (e.clientY - mimiOffsetY) + 'px';
    });

    document.addEventListener('mouseup', () => {
        if (window.isDraggingMimi) {
            // A tiny delay ensures dropping her doesn't accidentally trigger the click sound
            setTimeout(() => window.isDraggingMimi = false, 50);
            mimiContainer.classList.remove('dragging');
        }
    });
</script>

    <script>
        function bootSystem() {
            const loginAudio = new Audio('login.mp3');
            loginAudio.play().catch(e => {});

            const pulseContainer = document.getElementById('pulse-box');
            pulseContainer.style.animation = 'none';

            document.getElementById('splash-wrapper').classList.add('booting');
            document.getElementById('desktop-ui').classList.add('active');
            
            setTimeout(() => {
                document.getElementById('splash-wrapper').style.display = 'none';
            }, 4000);
        }

        function playRandomPop() {
            const pops = ['pop1.mp3', 'pop2.mp3', 'pop3.mp3'];
            const randomPop = pops[Math.floor(Math.random() * pops.length)];
            const audio = new Audio(randomPop);
            audio.play().catch(e => {});
        }

        /* Rich Text Editor Logic */
        function formatText(command) {
            document.execCommand(command, false, null);
            document.getElementById('mail-body').focus();
        }

        /* Web3Forms Silent Background Submit */
        document.getElementById('mingomail-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('send-button');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = 'Sending...';
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('message', document.getElementById('mail-body').innerHTML);

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    btn.innerHTML = 'Sent! ✅';
                    btn.style.background = '#4CAF50';
                    btn.style.color = '#fff';
                    this.reset();
                    document.getElementById('mail-body').innerHTML = '';
                    
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.style.background = 'var(--accent-colour)';
                        btn.style.color = '#000';
                        btn.disabled = false;
                    }, 4000);
                } else {
                    btn.innerHTML = 'Error ❌';
                    btn.style.background = '#ff5f57';
                    btn.disabled = false;
                }
            } catch (error) {
                btn.innerHTML = 'Error ❌';
                btn.style.background = '#ff5f57';
                btn.disabled = false;
            }
        });

        let zIndexCounter = 100;

        // Global Resize Logic (Exposed so external scripts like weather.js can use it)
        window.makeResizable = function(win) {
            if (win.querySelector('.resizer-br')) return; // Prevent duplicates

            const resizerR = document.createElement('div');
            resizerR.className = 'resizer resizer-r';
            const resizerB = document.createElement('div');
            resizerB.className = 'resizer resizer-b';
            const resizerBR = document.createElement('div');
            resizerBR.className = 'resizer resizer-br';

            win.appendChild(resizerR);
            win.appendChild(resizerB);
            win.appendChild(resizerBR);

            let isResizing = false;
            let currentResizer = null;
            let startX, startY, startWidth, startHeight;

            const onMouseDown = (e) => {
                isResizing = true;
                currentResizer = e.target;
                startX = e.clientX;
                startY = e.clientY;
                
                const rect = win.getBoundingClientRect();
                startWidth = rect.width;
                startHeight = rect.height;
                
                win.classList.add('resizing');
                focusWindow(win);
                e.preventDefault(); 
                e.stopPropagation(); 
            };

            const onMouseMove = (e) => {
                if (!isResizing) return;
                if (win.classList.contains('maximised')) return; // Prevent resizing when full screen

                if (currentResizer.classList.contains('resizer-r') || currentResizer.classList.contains('resizer-br')) {
                    win.style.width = (startWidth + e.clientX - startX) + 'px';
                }
                if (currentResizer.classList.contains('resizer-b') || currentResizer.classList.contains('resizer-br')) {
                    win.style.height = (startHeight + e.clientY - startY) + 'px';
                }
            };

            const onMouseUp = () => {
                if (isResizing) {
                    isResizing = false;
                    win.classList.remove('resizing');
                    currentResizer = null;
                }
            };

            resizerR.addEventListener('mousedown', onMouseDown);
            resizerB.addEventListener('mousedown', onMouseDown);
            resizerBR.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        };
        
        // Window Control Logic
        function toggleWindow(winId, dockElement) {
            const win = document.getElementById(winId);
            if (!win.classList.contains('active')) {
                win.classList.add('active');
                win.classList.remove('minimised');
                if (dockElement) dockElement.classList.add('active');
                focusWindow(win);
            } else if (win.classList.contains('minimised')) {
                win.classList.remove('minimised');
                focusWindow(win);
            } else {
                if (win.classList.contains('active-focus')) {
                    minimiseWindow(winId);
                } else {
                    focusWindow(win);
                }
            }
        }

        function minimiseWindow(winId) {
            const win = document.getElementById(winId);
            win.classList.add('minimised');
            win.classList.remove('active-focus');
            if (typeof playRandomPop === 'function') playRandomPop();
        }

        function closeWindow(winId, dockElementId) {
            const win = document.getElementById(winId);
            const dock = document.getElementById(dockElementId);
            win.classList.remove('active');
            win.classList.remove('minimised');
            if (dock) dock.classList.remove('active');
        }

        function maximiseWindow(winId) {
            const win = document.getElementById(winId);
            win.classList.toggle('maximised');
            focusWindow(win);
        }

        function focusWindow(win) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('active-focus'));
            win.classList.add('active-focus');
            zIndexCounter++;
            win.style.zIndex = zIndexCounter;
        }

        document.querySelectorAll('.window').forEach(win => {
            // Apply resizer logic to existing windows
            window.makeResizable(win);

            win.addEventListener('mousedown', () => focusWindow(win));
            const titleBar = win.querySelector('.title-bar');
            let isDragging = false, offsetX, offsetY;
            
            titleBar.addEventListener('mousedown', (e) => {
                // Prevent dragging if clicking a control button
                if (e.target.classList.contains('win-btn')) return;
                
                isDragging = true;
                win.classList.add('dragging'); // Temporarily removes transitions
                offsetX = e.clientX - win.getBoundingClientRect().left;
                offsetY = e.clientY - win.getBoundingClientRect().top;
                focusWindow(win);
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                if (win.classList.contains('maximised')) return;
                win.style.left = (e.clientX - offsetX) + 'px';
                win.style.top = (e.clientY - offsetY) + 'px';
            });
            
            document.addEventListener('mouseup', () => { 
                isDragging = false; 
                win.classList.remove('dragging'); // Restores transitions
            });
            
            titleBar.addEventListener('dblclick', (e) => {
                if (!e.target.classList.contains('win-btn')) {
                    maximiseWindow(win.id);
                }
            });
        });

        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('clock').textContent = now.toLocaleDateString('en-GB', options).replace(',', '');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
